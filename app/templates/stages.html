<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/MainPage.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/stages.css') }}">
    <title>Select a Stage</title>
</head>

<body class="min-vh-100 d-flex flex-column">

    <nav class="profile-navbar">
    <a class="brand" href="{{ url_for('main.stages') }}">YOU GOOD MUD?</a>
    <div class="dropdown">
        <button class="profile-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <div class="profile-initial" id="navProfileDisplay">
                {% if current_user.is_authenticated %}
                    {{ (current_user.display_name or current_user.username)[0].upper() }}
                {% else %}?{% endif %}
            </div>
        </button>
        <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark">
            <li>
                <span class="dropdown-item-text text-secondary small">
                    {{ current_user.display_name or current_user.username if current_user.is_authenticated else 'Guest' }}
                </span>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
                <a class="dropdown-item" href="{{ url_for('main.customisation') }}">
                    &#9881; Customise Profile
                </a>
            </li>
            <li>
                <a class="dropdown-item text-danger" href="{{ url_for('main.logout') }}">
                    &#8594; Logout
                </a>
            </li>
        </ul>
    </div>
</nav>

    <div class="container py-5">

        <header class="stage-header">
            <h1>Choose a Game!</h1>
        </header>

        <main class="stage-grid">
            <article class="stage-card">
                <h2>Stage 1</h2>
                <p>Where's Wilson</p>
                <a href="{{ url_for('main.game1') }}"><button>Play</button></a>
            </article>

            <article class="stage-card">
                <h2>Stage 2</h2>
                <p>RNG tictactoe</p>
                <a href="{{ url_for('main.tictactoe') }}"><button class="btn btn-light">Play</button></a>
            </article>

            <article class="stage-card">
                <h2>Stage 3</h2>
                <p>Kai's Game Idea</p>
                <button class="btn btn-light">Play</button>
            </article>
        </main>

    </div>

    <audio id="tickHover" src="{{ url_for('static', filename='sounds/milkteatrackv2.ogg') }}" preload="auto"></audio>
    <!-- <audio id="tickClick" src="{{ url_for('static', filename='sounds/Tick3.ogg') }}" preload="auto"></audio> -->
    <audio id="tickClick" src="{{ url_for('static', filename='sounds/milkteatrackv2.ogg') }}" preload="auto"></audio>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='js/navbar.js') }}"></script>
    <script src="{{ url_for('static', filename='js/stages.js') }}"></script>

</body>

</html>
