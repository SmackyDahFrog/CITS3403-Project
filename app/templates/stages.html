<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select a Stage</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/MainPage.css') }}"> 
    <link rel="stylesheet" href="{{ url_for('static', filename='css/stages.css') }}">
</head>
<body>
    <div class="page-frame">
        <header class="stage-header">
            <h1>Choose a Game!</h1>
        </header>

        <main class="stage-grid">
            <article class="stage-card">
                <h2>Stage 1</h2>
                <p>Where's Wilson</p>
                <a href="{{ url_for('main.game1') }}"><button>Play</button></a>
            </article>

            <article class="stage-card">
                <h2>Stage 2</h2>
                <p>RNG tictactoe</p>
                <a href="{{ url_for('main.tictactoe') }}"><button>Play</button></a>
            </article>

            <article class="stage-card">
                <h2>Stage 3</h2>
                <p>Kai's Game Idea</p>
                <button>Play</button>
            </article>
        </main>
    </div>
</body>
</html>
