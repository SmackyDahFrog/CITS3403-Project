<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNG Tic</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/MainPage.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ticTacToe.css') }}">
</head>
<body>
    <div class="page-frame">
        <h1 class="tttHeader">RNG Tic-Tac-Toe</h1>
        <p class="tttSubtitle">Verse a computer in Tic-Tac-Toe, where it plays optimally. It will sometimes make a random move, so use that as a chance to win!</p>
 
        <main class="tttBoard">
            <button class="tttCell" data-index="0"></button>
            <button class="tttCell" data-index="1"></button>
            <button class="tttCell" data-index="2"></button>
            <button class="tttCell" data-index="3"></button>
            <button class="tttCell" data-index="4"></button>
            <button class="tttCell" data-index="5"></button>
            <button class="tttCell" data-index="6"></button>
            <button class="tttCell" data-index="7"></button>
            <button class="tttCell" data-index="8"></button>
        </main>
 
        <div class="tttControls">
            <button type="button" id="resetBtn" class="ttt-btn-light">Restart (R)</button>
            <a href="{{ url_for('main.stages') }}" class="ttt-btn-outline-light">Back to Stages</a>
        </div>
    </div>
 
    <script src="{{ url_for('static', filename='js/gameLogic.js') }}"></script>
</body>
</html>
