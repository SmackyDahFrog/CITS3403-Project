{% extends 'base.html' %}
{% block title %}Security Question — YOU GOOD MUD?{% endblock %}

{% block content %}
<div class="container py-4 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card p-4">
                <h4 class="mb-3 text-center">Security Question</h4>
                <p class="text-center mb-4 fw-semibold">{{ question }}</p>
                <form method="POST">
                    {{ form.hidden_tag() }}
                    <div class="mb-3">
                        <label for="answer" class="form-label">Your Answer</label>
                        <input type="text" id="answer" name="answer" class="form-control" autocomplete="off">
                        {% if form.answer.errors %}
                            {% for error in form.answer.errors %}
                                <div class="text-danger small">{{ error }}</div>
                            {% endfor %}
                        {% endif %}
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Verify</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    <a href="{{ url_for('main.forgot_password') }}">Back</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
