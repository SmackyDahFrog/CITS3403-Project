<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/MainPage.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/kai.css') }}">
    <title>Kai's Game</title>
</head>

<body class="min-vh-100 d-flex flex-column">

    <nav class = "profile-navbar">
    <a class = "brand" href = "{{ url_for('main.stages') }}">YOU GOOD MUD?</a>

    <div class ="dropdown">
        <button class = "profile-btn" type = "button" data-bs-toggle="dropdown" aria-expanded="false">
            <div class = "profile-initial" id = "navProfileDisplay">?</div>
        </button>
        <ul class = "dropdown-menu dropdown-menu-end dropdown-menu-dark">
            <li>
                <span class="dropdown-item-text text-secondary small" id="navDisplayName">
                Guest
                </span>
            </li>
            <li><hr class = "dropdown-divider"></li>
            <li>
                <a class = "dropdown-item" href="{{ url_for('main.customisation') }}">
                    &#9881; Customise Profile
                </a>
            </li>
            <li>
                <a class = "dropdown-item text-danger" href ="{{ url_for('main.login') }}" onclick="handleLogout()">
                    &#8594; Logout
                </a>
            </li>
        </ul>
    </div>
</nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h1 class="text-center mb-3">Kai's Game</h1>
                <p class="text-center text-secondary mb-3">
                    Click the ball before your score bleeds to zero. Each hit shrinks it.
                </p>
                <div class="d-flex justify-content-center mb-3">
                    <canvas id="kaiCanvas" width="600" height="600"></canvas>
                </div>
                <div class="text-center">
                    <button id="restartBtn" class="btn btn-light">Restart (R)</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I"
        crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='js/navbar.js') }}"></script>
    <script src="{{ url_for('static', filename='js/kai-game.js') }}"></script>
</body>

</html>
