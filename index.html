<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Good Mud?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-frame">
        <header class="top-banner">
            <div class="title-box">
                <img src="logo.png" alt="Game logo" class="logo">
                <h1>The HumanBenchmark.com of Gaming</h1>
            </div>
        </header>

        <main class="main-layout">
            <section class="left-panel">
                <div class="info-box">
                    <h2>About</h2>
                    <p>Clear all 3 games to see whether you're good or not!</p>
                </div>

                <div class="info-box">
                    <h2>Developed By</h2>
                    <ul>
                        <li>Chris</li>
                        <li>Kai</li>
                        <li>Michael</li>
                        <li>John</li>
                    </ul>
                </div>
            </section>

            <section class="center-panel">
                <div class="login-box">
                    <h2>Login</h2>
                    <form>
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username">

                        <label for="password">Password</label>
                        <input type="password" id="password" name="password">

                        <a href="#" class="create-account">Create account</a>

                        <div class="button-group">
                            <button type="submit">Play</button>
                            <button type="button">Play as Guest</button>
                        </div>
                    </form>
                </div>
            </section>

            <aside class="right-panel">
                <div class="leaderboard-box">
                    <h2>Leaderboard</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Time</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td>Alice</td><td>01:21</td></tr>
                            <tr><td>Ben</td><td>01:35</td></tr>
                            <tr><td>Chris</td><td>01:42</td></tr>
                            <tr><td>Dylan</td><td>01:55</td></tr>
                            <tr><td>Emma</td><td>02:03</td></tr>
                        </tbody>
                    </table>
                </div>
            </aside>
        </main>
    </div>
</body>
</html>
