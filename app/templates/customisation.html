<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="MainPage.css">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="customisation.css">
    <title>Customise Profile</title>
</head>

<body class="min-vh-100 d-flex flex-column">

    <nav class = "profile-navbar">
    <a class = "brand" href = "stages.html">YOU GOOD MUD?</a>

    <div class ="dropdown">
        <button class = "profile-btn" type = "button" data-bs-toggle="dropdown" aria-expanded="false">
            <div class = "profile-initial" id = "navProfileDisplay">?</div>
        </button>
        <ul class = "dropdown-menu dropdown-menu-end dropdown-menu-dark">
            <li>
                <span class="dropdown-item-text text-secondary small" id="navDisplayName">
                Guest
                </span>
            </li>
            <li><hr class = "dropdown-divider"></li>
            <li>
                <a class = "dropdown-item" href="customisation.html">
                    &#9881; Customise Profile
                </a>
            </li>
            <li>
                <a class = "dropdown-item text-danger" href ="MainPage.html" onclick="handleLogout()">
                    &#8594; Logout
                </a>
            </li>
        </ul>
    </div>
</nav>

    <div class="container flex-grow-1 d-flex align-items-center">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-md-6 col-lg-5">

                <div class="card p-4">

                    <div class="text-center mb-3">
                        <h2>Customise Your Profile</h2>
                        <p class="small mb-0">Your display name is what appears on the leaderboard.</p>
                    </div>

                    <!-- Display Name -->
                    <div class="mb-4">
                        <label for="displayName" class="form-label">Display Name</label>
                        <input type="text" id="displayName" name="displayName" class="form-control"
                            maxlength="20" placeholder="Enter your display name">
                        <div class="form-text">Max 20 characters. Different from your username.</div>
                    </div>

                    <!-- Avatar Selection -->
                    <div class="mb-4">
                        <label class="form-label">Choose a Profile Picture</label>
                        <div class="d-flex flex-wrap justify-content-center gap-3 mt-2">

                            <div class="avatar-option">
                                <img src="avatars/av1.png" alt="Avatar 1" width="64" height="64"
                                    class="rounded-circle border border-2 selected"
                                    onclick="selectAvatar(this, 'av1')">
                            </div>
                            <div class="avatar-option">
                                <img src="avatars/av2.png" alt="Avatar 2" width="64" height="64"
                                    class="rounded-circle border border-2"
                                    onclick="selectAvatar(this, 'av2')">
                            </div>
                            <div class="avatar-option">
                                <img src="avatars/av3.png" alt="Avatar 3" width="64" height="64"
                                    class="rounded-circle border border-2"
                                    onclick="selectAvatar(this, 'av3')">
                            </div>
                            <div class="avatar-option">
                                <img src="avatars/av4.png" alt="Avatar 4" width="64" height="64"
                                    class="rounded-circle border border-2"
                                    onclick="selectAvatar(this, 'av4')">
                            </div>
                            <div class="avatar-option">
                                <img src="avatars/av5.png" alt="Avatar 5" width="64" height="64"
                                    class="rounded-circle border border-2"
                                    onclick="selectAvatar(this, 'av5')">
                            </div>
                            <div class="avatar-option">
                                <img src="avatars/av6.png" alt="Avatar 6" width="64" height="64"
                                    class="rounded-circle border border-2"
                                    onclick="selectAvatar(this, 'av6')">
                            </div>
                            <div class="avatar-option">
                                <img src="avatars/av7.png" alt="Avatar 7" width="64" height="64"
                                    class="rounded-circle border border-2"
                                    onclick="selectAvatar(this, 'av7')">
                            </div>
                            <div class="avatar-option">
                                <img src="avatars/av8.png" alt="Avatar 8" width="64" height="64"
                                    class="rounded-circle border border-2"
                                    onclick="selectAvatar(this, 'av8')">
                            </div>

                        </div>
                        <input type="hidden" id="selectedAvatar" value="av1">
                    </div>

                    <button class="btn btn-primary w-100 mb-3" onclick="handleCustomisation()">
                        Save &amp; Start Playing
                    </button>

                    <p class="text-center mb-0">
                        <a href="stages.html">Skip for now</a>
                    </p>

                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I"
        crossorigin="anonymous"></script>
    <script src="navbar.js"></script>
    <script src="customisation.js"></script>

</body>

</html>
