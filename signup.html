<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="MainPage.css">
    <link rel="stylesheet" href="signup.css">
    <title>Create Account</title>
</head>

<body class="min-vh-100 d-flex align-items-center">

    <div class="container">

        <div class="row">
            <div class="col text-center">
                <img src="logo.png" alt="Website Logo" class="img-fluid w-25 mb-3">
                <h1>The Human Benchmark of Gaming!</h1>
                <p>Test your skills, pass all 3 games and you're good!</p>
            </div>
        </div>

        <div class="row justify-content-center mt-4">
            <div class="col-12 col-md-6 col-lg-4">

                <div class="card p-4">

                    <div class="text-center mb-3">
                        <h2>Create Account</h2>
                    </div>

                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" name="username" class="form-control"
                            maxlength="15" placeholder="Min. 4 characters" oninput="validateUsername()">
                        <div id="usernameError" class="text-danger small" style="display:none;">
                            Username must be at least 4 characters.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control"
                            maxlength="32" placeholder="Min. 8 characters" oninput="validatePasswords()">
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                            maxlength="32" placeholder="Re-enter your password" oninput="validatePasswords()">
                        <div id="passwordError" class="text-danger small" style="display:none;">
                            Passwords do not match.
                        </div>
                    </div>

                    <button class="btn btn-primary w-100 mb-3" onclick="handleSignup()">Create Account</button>

                    <p class="text-center mb-0">
                        Already have an account?
                        <a href="MainPage.html">Login</a>
                    </p>

                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I"
        crossorigin="anonymous"></script>
    <script src="signup.js"></script>

</body>

</html>
